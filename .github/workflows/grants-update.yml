name: Daily grants monitor

# Runs every day at 06:00 UTC (08:00 Budapest in summer) — pings the known
# Hungarian grant-source sites, writes aipalyazo/grants-status.json with
# reachability + timestamps, and commits if anything changed. GitHub Pages
# auto-deploys the new JSON so the portal shows up-to-date freshness.
on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch: {} # also runnable manually from the Actions tab

permissions:
  contents: write
  issues: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run grant monitor
        run: node scripts/update-grants.mjs

      - name: Test the feed builder and monitor (offline)
        run: node --test scripts/feed.test.mjs scripts/monitor/monitor.test.mjs scripts/match.test.mjs scripts/pages.test.mjs

      # Re-checks every listed item on its official page, discovers new calls
      # on official listing pages, fact-checks them with quotes from the page.
      # GEMINI_API_KEY (or ANTHROPIC_API_KEY) is optional: without it only the
      # deterministic checks run and new pages go to the review issue.
      - name: Daily monitor (discover + fact-check)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MAX_LLM_CALLS: '80'
        run: |
          node scripts/monitor/run.mjs
          cat scripts/monitor/report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Build live grant feed (palyazat.gov.hu API + hand-verified list + EU Funding & Tenders API)
        run: node scripts/fetch-live-grants.mjs

      # One public, indexable page per call + index + sitemap (SEO).
      - name: Build public call pages
        run: node scripts/build-pages.mjs

      - name: Commit changes (if any)
        run: |
          git config user.name "aipalyazo-bot"
          git config user.email "bot@aipalyazo.hu"
          git add aipalyazo/grants-status.json aipalyazo/grants_live.json aipalyazo/grants-meta.json scripts/monitor/state.json scripts/monitor/flags.json scripts/monitor/auto-grants.json scripts/monitor/review-queue.json aipalyazo/summaries.json aipalyazo/palyazat aipalyazo/sitemap.xml robots.txt
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            CHANGES=$(node -e "try{const m=require('./aipalyazo/grants-meta.json');const c=m.changes||[];console.log(c.length?c.slice(0,5).map(x=>x.type+': '+(x.title||x.id).slice(0,60)).join('; '):'refresh')}catch(e){console.log('n/a')}")
            git commit -m "data: daily live grant feed ($(date -u +%Y-%m-%d)) — $CHANGES"
            git push
          fi

      # Opt-in instant e-mails (new eligible calls, saved calls >80% committed).
      # The function only mails users who switched it on; alert_log stops repeats.
      # Skipped quietly until CRON_SECRET is set. Response body is not printed.
      - name: Send instant alerts (opt-in users only)
        continue-on-error: true
        env:
          ANON: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImthY252Y2h3Znd2cGtreWh5dXBiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA1NzQwNDEsImV4cCI6MjA5NjE1MDA0MX0.ajkwWvyPP-ENAnOXmokvBQ-1PP0So-qoZg4DJmsPob0'
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then echo "CRON_SECRET not set — skipping."; exit 0; fi
          node -e "const g=require('./aipalyazo/grants_live.json');const m=require('./aipalyazo/grants-meta.json');process.stdout.write(JSON.stringify({grants:g,changes:m.changes||[]}))" > /tmp/alerts.json
          CODE=$(curl -sS -o /tmp/alerts-resp.json -w '%{http_code}' -X POST "https://kacnvchwfwvpkkyhyupb.supabase.co/functions/v1/instant-alerts" \
            -H "Authorization: Bearer $ANON" -H "apikey: $ANON" -H "x-cron-secret: $CRON_SECRET" \
            -H "Content-Type: application/json" --data-binary @/tmp/alerts.json)
          echo "instant-alerts HTTP $CODE"
          node -e "try{const r=require('/tmp/alerts-resp.json');console.log('sent',r.sent,'skipped',r.skipped,'failed',r.failed,r.reason||'')}catch(e){}"

      - name: Post the review list to a GitHub issue (if anything needs a human)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          N=$(node -e "console.log(require('./scripts/monitor/review-queue.json').items.length)")
          if [ "$N" = "0" ]; then echo "Nothing to review."; exit 0; fi
          gh label create napi-ellenorzes --color FBCA04 --description "AIpályázó daily review" --force
          ISSUE=$(gh issue list --label napi-ellenorzes --state open --json number -q '.[0].number')
          if [ -n "$ISSUE" ]; then gh issue comment "$ISSUE" --body-file scripts/monitor/report.md
          else gh issue create --title "Pályázatok — kézi ellenőrzésre vár" --label napi-ellenorzes --body-file scripts/monitor/report.md; fi
